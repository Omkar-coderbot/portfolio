<div class="min-h-screen font-sans selection:bg-blue-600 selection:text-white dark:selection:bg-sky-500 dark:selection:text-slate-950 antialiased transition-colors duration-200">
  <!-- Sticky Nav Header with Frosted Alabaster / Obsidian Surface & Hover Identity Reveal -->
  <app-nav-header />

  <!-- Main Portfolio Content -->
  <main>
    <!-- Hero Section with Profile Hover Links & Solid Stat Blocks (No background grids, graphs or contour lines) -->
    <app-hero />

    <!-- Split Project / Case-Study Cards with Dedicated Real Image & Media Slots (3D Cesium & 2D Konva Switcher) -->
    <app-case-studies />

    <!-- How I Work (Clean 3-Column Section: Client Technical POC, Mentoring, Practical Performance) -->
    <app-how-i-work />

    <!-- Technical Stack Matrix (Categorized 4-Pillar Architecture) -->
    <app-tech-stack />

    <!-- Experience & Education Timeline Section -->
    <app-experience />
  </main>

  <!-- Engineering Footer -->
  <app-footer />

  <!-- Embedded Knowledge Assistant -->
  <app-ai-assistant />

  <!-- Clean Toast Notification -->
  @if (toastService.currentToast(); as toast) {
    <div class="fixed top-20 right-4 sm:right-6 z-50 animate-in fade-in slide-in-from-top-3 duration-150 pointer-events-auto">
      <div
        class="flex items-center gap-3 px-4 py-3 rounded-xs border border-[#E8E5DF] dark:border-[#1C2436] bg-white dark:bg-[#0E1320] shadow-xl text-xs font-mono"
        [class.text-emerald-800]="toast.type === 'success'"
        [class.dark:text-emerald-300]="toast.type === 'success'"
        [class.text-blue-800]="toast.type === 'info'"
        [class.dark:text-sky-300]="toast.type === 'info'"
        [class.text-rose-800]="toast.type === 'error'"
        [class.dark:text-rose-300]="toast.type === 'error'">
        @if (toast.type === 'success') {
          <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
          </svg>
        } @else {
          <svg class="w-4 h-4 text-blue-600 dark:text-sky-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
        <span class="text-stone-900 dark:text-white font-medium">{{ toast.message }}</span>
        <button
          type="button"
          (click)="toastService.dismiss()"
          aria-label="Dismiss notification"
          class="ml-2 text-stone-400 hover:text-stone-700 dark:text-slate-500 dark:hover:text-white cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  }
</div>
